name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: syjinxz77
  IMAGE_NAME: syjinxz77/minikube-flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Push image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Check out manifests repo
        uses: actions/checkout@v4
        with:
          repository: Szin7/minikube-flask-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - name: Update image tag in manifests
        working-directory: manifests
        run: |
          sed -i "s|image: .*|image: $IMAGE_NAME:$IMAGE_TAG|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "Image tag already up to date"
            exit 0
          fi
          git commit -m "Update image to $IMAGE_TAG"
          git push